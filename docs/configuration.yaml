# ─────────────────────────────────────────────────────────────────────────────
# Bluetooth Audio Server — Example configuration.yaml
#
# NOTE: The core integration (domain: bluetooth_audio_server) is configured
# entirely through the UI config flow (Settings → Devices & Services).
# No YAML entry is needed for the integration itself.
#
# This file shows:
#   1. Lovelace resource registration (or use the UI)
#   2. Helper entities used by the included automations
#   3. Group definitions for family presence detection
#   4. An optional notify service call template (for the broadcast scenario)
# ─────────────────────────────────────────────────────────────────────────────


# ─── Lovelace Resources ───────────────────────────────────────────────────────
# Alternatively, add via: Settings → Dashboards → Resources → Add Resource
#   URL: /local/bluetooth-audio-card.js  |  Type: JavaScript module

lovelace:
  mode: yaml  # only needed if you manage dashboards as YAML
  resources:
    - url: /local/bluetooth-audio-card.js
      type: module


# ─── Dashboard Panel (optional sidebar shortcut) ─────────────────────────────
panel_custom:
  - name: bluetooth-audio-panel
    sidebar_title: Music Server
    sidebar_icon: mdi:bluetooth-audio
    url_path: bluetooth-audio
    module_url: /local/bluetooth-audio-card.js


# ─── Input Helpers ────────────────────────────────────────────────────────────
# These helpers drive the automation examples in docs/automations/.
# Create them here or via: Settings → Devices & Services → Helpers

input_boolean:
  # Manually toggleable master switch — used by conditional_playback.yaml
  bt_audio_enabled:
    name: "BT Audio Enabled"
    icon: mdi:bluetooth-audio

  # Set to 'on' when party / broadcast mode is active
  bt_audio_party_mode:
    name: "BT Audio Party Mode"
    icon: mdi:speaker-multiple

input_number:
  # Global volume ceiling applied during night hours (0.0 – 1.0)
  bt_audio_night_volume:
    name: "BT Audio Night Volume"
    min: 0.0
    max: 1.0
    step: 0.05
    initial: 0.25
    unit_of_measurement: ""
    icon: mdi:volume-low

  # Per-room delay overrides (useful for quickly testing sync)
  bt_audio_delay_living_room:
    name: "Living Room Delay"
    min: 0
    max: 2000
    step: 10
    initial: 0
    unit_of_measurement: "ms"
    icon: mdi:timer-sand

  bt_audio_delay_bedroom:
    name: "Bedroom Delay"
    min: 0
    max: 2000
    step: 10
    initial: 150      # example: bedroom speaker is 150 ms slower than living room
    unit_of_measurement: "ms"
    icon: mdi:timer-sand

  bt_audio_delay_kitchen:
    name: "Kitchen Delay"
    min: 0
    max: 2000
    step: 10
    initial: 80
    unit_of_measurement: "ms"
    icon: mdi:timer-sand

input_button:
  # One-press broadcast trigger (used by mass_broadcast.yaml)
  bt_audio_broadcast_all:
    name: "Broadcast to All Speakers"
    icon: mdi:broadcast

  # Quick-stop all outputs
  bt_audio_stop_all:
    name: "Stop All Speakers"
    icon: mdi:stop-circle


# ─── Groups ───────────────────────────────────────────────────────────────────
# Used by the conditional_playback automation to detect occupancy.
# Adjust person entity IDs to match your setup.

group:
  family:
    name: "Family"
    entities:
      - person.spike          # replace with your actual person entities
      - person.housemate


# ─── Binary Sensors for Room Presence ────────────────────────────────────────
# These are EXAMPLES — replace with your actual presence sensors
# (mmWave sensors, PIR motion sensors, BLE presence, etc.).
# The moving_room.yaml automation references these entity IDs.

# If you use template sensors to combine multiple triggers per room:
template:
  - binary_sensor:
      - name: "Presence - Living Room"
        unique_id: presence_living_room
        device_class: occupancy
        # Combine PIR + mmWave for robust detection
        state: >
          {{ is_state('binary_sensor.living_room_pir', 'on')
             or is_state('binary_sensor.living_room_mmwave', 'on') }}
        delay_off:
          minutes: 3      # don't cut audio immediately when motion stops

      - name: "Presence - Bedroom"
        unique_id: presence_bedroom
        device_class: occupancy
        state: >
          {{ is_state('binary_sensor.bedroom_pir', 'on')
             or is_state('binary_sensor.bedroom_mmwave', 'on') }}
        delay_off:
          minutes: 3

      - name: "Presence - Kitchen"
        unique_id: presence_kitchen
        device_class: occupancy
        state: "{{ is_state('binary_sensor.kitchen_pir', 'on') }}"
        delay_off:
          minutes: 2


# ─── Notify (optional) ────────────────────────────────────────────────────────
# Used by the mass_broadcast scenario to send a phone notification
# confirming that broadcast mode was activated.
# Adjust the platform to match your notification setup.

notify:
  - platform: mobile_app
    name: spike_phone   # replace with your mobile_app notify target


